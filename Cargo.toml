[package]
name = "example-web-service"
version = "0.1.0"
edition = "2024"
description = "Example web server"
license = "Apache-2.0"
repository = "https://github.com/8Mouheb-Baalouch8/example-web-service"

[dependencies]
tokio = { version = "1", features = ["full"] }
mini-redis = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
